[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dopplergps"
version = "0.1.0"
description = "Acoustic Aircraft Doppler Geolocation Pipeline: Pinpointing ground observers using propeller flyover audio, ADS-B telemetry, and digital elevation models."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Dyne Research", email = "research@dyneresearch.com"}
]
keywords = [
    "osint",
    "doppler-effect",
    "acoustic-geolocation",
    "adsb",
    "geospatial",
    "signal-processing",
    "spectrogram",
    "flight-tracking",
    "physics-engine"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: GIS",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = [
    "duckdb>=1.0.0",
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "pyproj>=3.6.0",
    "scipy>=1.12.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "rasterio>=1.3.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "folium>=0.16.0",
    "matplotlib>=3.8.0"
]

[project.scripts]
dopplergps = "doppler_geo.cli:main"
doppler-geo = "doppler_geo.cli:main"

[tool.setuptools.packages.find]
include = ["doppler_geo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

